<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Employee Registration Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Segoe UI',sans-serif;
            overflow-x:hidden;
            min-height:100vh;
            background:
                radial-gradient(circle at 15% 20%,rgba(0,212,255,.25),transparent 20%),
                radial-gradient(circle at 85% 80%,rgba(124,58,237,.30),transparent 25%),
                linear-gradient(135deg,#020617,#0f172a,#1e3a8a,#312e81);
        }

        .circle{
            position:fixed;
            border-radius:50%;
            filter:blur(90px);
            z-index:-1;
            animation:float 8s ease-in-out infinite alternate;
        }

        .c1{
            width:250px;
            height:250px;
            background:#00d4ff;
            top:40px;
            left:40px;
        }

        .c2{
            width:300px;
            height:300px;
            background:#7c3aed;
            bottom:30px;
            right:20px;
        }

        .c3{
            width:180px;
            height:180px;
            background:#38bdf8;
            top:45%;
            left:55%;
        }

        @keyframes float{
            from{transform:translateY(0);}
            to{transform:translateY(-30px);}
        }

        .top-bar{
            position:fixed;
            top:25px;
            right:35px;
            z-index:999;
        }

        .admin-btn{
            background:linear-gradient(45deg,#ff9800,#ff5722);
            color:white;
            padding:12px 24px;
            border-radius:30px;
            text-decoration:none;
            font-weight:bold;
            box-shadow:0 0 20px rgba(255,152,0,.7);
            transition:.3s;
        }

        .admin-btn:hover{
            color:white;
            transform:translateY(-3px);
            box-shadow:0 0 30px rgba(255,152,0,.9);
        }

        .overlay{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:40px;
        }

        .card{
            width:760px;
            background:rgba(255,255,255,.10);
            backdrop-filter:blur(20px);
            border-radius:25px;
            color:white;
            border:1px solid rgba(255,255,255,.15);
            box-shadow:
                0 15px 50px rgba(0,0,0,.5),
                0 0 35px rgba(0,212,255,.25);
        }

        .logo{
            font-size:36px;
            font-weight:bold;
            color:#00f5ff;
            text-shadow:0 0 20px cyan;
        }

        h4{
            margin-top:10px;
            font-weight:600;
        }

        .form-control,
        .form-select{
            background:rgba(255,255,255,.12);
            color:white;
            border:1px solid rgba(255,255,255,.25);
        }

        .form-control::placeholder{
            color:#ddd;
        }

        .form-select option{
            color:black;
        }

        .form-control:focus,
        .form-select:focus{
            background:rgba(255,255,255,.15);
            color:white;
            border-color:#00d4ff;
            box-shadow:0 0 15px rgba(0,212,255,.6);
        }

        label{
            font-weight:500;
            margin-bottom:5px;
        }

        .btn-ai{
            background:linear-gradient(90deg,#00c6ff,#0072ff);
            color:white;
            border:none;
            border-radius:35px;
            font-size:18px;
            font-weight:bold;
            transition:.3s;
        }

        .btn-ai:hover{
            transform:translateY(-3px);
            box-shadow:0 0 25px #00d4ff;
            color:white;
        }

        .footer{
            text-align:center;
            color:#ddd;
            margin-top:25px;
            font-size:14px;
        }
    </style>

</head>

<body>

<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>

<div class="top-bar">
    <a href="/admin" class="admin-btn">
        🔐 Admin Login
    </a>
</div>

<div class="overlay">

<div class="card p-4">

<div class="text-center mb-4">

<div class="logo">
🤖 AI Employee Management
</div>

<h4>Next Generation Registration Portal</h4>

<p class="text-light">
Secure • Intelligent • Cloud Powered
</p>

</div>

<form action="/add" method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<label>Name</label>
<input type="text" name="name" class="form-control" placeholder="Employee Name" required>
</div>

<div class="col-md-6 mb-3">
<label>Father Name</label>
<input type="text" name="father_name" class="form-control" placeholder="Father Name" required>
</div>

<div class="col-md-6 mb-3">
<label>Mobile</label>
<input type="text" name="mobile" class="form-control" placeholder="9876543210" required>
</div>

<div class="col-md-6 mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" placeholder="abc@gmail.com" required>
</div>

<div class="col-md-6 mb-3">
<label>Qualification</label>
<select name="qualification" class="form-select">
<option>B.Tech</option>
<option>BCA</option>
<option>MCA</option>
<option>M.Tech</option>
<option>MBA</option>
<option>Diploma</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Address</label>
<input type="text" name="address" class="form-control" placeholder="Address" required>
</div>

<div class="col-12 mt-4">
<button type="submit" class="btn btn-ai w-100 btn-lg">
🚀 Register Employee
</button>
</div>

</form>

<hr class="border-light">

<div class="footer">
🚀 Powered by Flask • MongoDB • Docker • GCP • CI/CD
</div>

</div>

</div>

</body>

</html>
