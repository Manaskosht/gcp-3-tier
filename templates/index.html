<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workshop - Employee Registration Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1677442136019-21780ecad995?auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
        }

        .overlay {
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .card {
            width: 700px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 25px rgba(0,255,255,0.4);
            color: white;
        }

        .card h2 {
            color: #00e5ff;
            font-weight: bold;
        }

        label {
            font-weight: 600;
        }

        .form-control {
            background: rgba(255,255,255,0.15);
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .form-control::placeholder {
            color: #ddd;
        }

        .form-control:focus {
            background: rgba(255,255,255,0.2);
            color: white;
            border-color: cyan;
            box-shadow: 0 0 10px cyan;
        }

        textarea {
            resize: none;
        }

        .btn-ai {
            background: linear-gradient(90deg,#00c6ff,#0072ff);
            border: none;
            font-size: 18px;
            font-weight: bold;
            color: white;
        }

        .btn-ai:hover {
            background: linear-gradient(90deg,#0072ff,#00c6ff);
            transform: scale(1.03);
            transition: 0.3s;
        }
    </style>

</head>

<body>

<div class="overlay">

    <div class="card p-4">

        <h2 class="text-center mb-4">
            🤖 AI Workshop 2026
        </h2>

        <h4 class="text-center mb-4">
            Employee Registration Form
        </h4>

        <form action="/add" method="POST">

            <div class="mb-3">
                <label>Employee Name</label>
                <input type="text" class="form-control" name="name" placeholder="Enter Employee Name" required>
            </div>

            <div class="mb-3">
                <label>Father's Name</label>
                <input type="text" class="form-control" name="father_name" placeholder="Enter Father's Name" required>
            </div>

            <div class="mb-3">
                <label>Mobile Number</label>
                <input type="tel" class="form-control" name="mobile" placeholder="Enter Mobile Number" required>
            </div>

            <div class="mb-3">
                <label>Email Address</label>
                <input type="email" class="form-control" name="email" placeholder="Enter Email Address" required>
            </div>

            <div class="mb-3">
                <label>Qualification</label>
                <select class="form-control" name="qualification" required>
                    <option value="">Select Qualification</option>
                    <option>High School</option>
                    <option>Diploma</option>
                    <option>B.Tech</option>
                    <option>BCA</option>
                    <option>MCA</option>
                    <option>M.Tech</option>
                    <option>MBA</option>
                    <option>PhD</option>
                </select>
            </div>

            <div class="mb-3">
                <label>Address</label>
                <textarea class="form-control" rows="3" name="address" placeholder="Enter Full Address" required></textarea>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-ai btn-lg">
                    🚀 Register Employee
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
