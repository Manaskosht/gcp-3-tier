<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Employee Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="glow glow3"></div>

<div class="top-bar">

    <a href="/admin" class="admin-btn">
        🔐 Admin Login
    </a>

</div>

<section class="container-fluid">

<div class="row vh-100 align-items-center">

<div class="col-lg-6 left-section">

<h1>

🤖 AI Employee Management

</h1>

<h4>

Next Generation Registration Portal

</h4>

<p>

Fast • Secure • Cloud Powered

</p>

<div class="feature-box">

<div class="feature">

🚀 Fast Registration

</div>

<div class="feature">

☁️ Cloud Native

</div>

<div class="feature">

🔒 Secure Data

</div>

<div class="feature">

🤖 AI Ready

</div>

</div>

</div>

<div class="col-lg-6">

<div class="glass-card">

<h2 class="text-center mb-4">

Employee Registration

</h2>

<form action="/add" method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
placeholder="Employee Name"
required>

</div>

<div class="col-md-6 mb-3">

<label>Father Name</label>

<input
type="text"
name="father_name"
class="form-control"
placeholder="Father Name"
required>

</div>

<div class="col-md-6 mb-3">

<label>Mobile</label>

<input
type="text"
name="mobile"
class="form-control"
placeholder="9876543210"
required>

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
placeholder="abc@gmail.com"
required>

</div>

<div class="col-md-6 mb-3">

<label>Qualification</label>

<select
name="qualification"
class="form-select">

<option>B.Tech</option>
<option>BCA</option>
<option>MCA</option>
<option>M.Tech</option>
<option>MBA</option>
<option>Diploma</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Address</label>

<input
type="text"
name="address"
class="form-control"
placeholder="Address"
required>

</div>

<div class="col-12 mt-4">

<button
class="btn register-btn w-100">

🚀 Register Employee

</button>

</div>

</div>

</form>

<hr>

<div class="footer">

Powered by Flask • MongoDB • Docker • GCP • CI/CD

</div>

</div>

</div>

</div>

</section>

</body>

</html>
