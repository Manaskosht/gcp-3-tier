<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workshop - Employee Registration</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            margin:0;
            font-family:Segoe UI,sans-serif;
            background:linear-gradient(135deg,#0f172a,#1e3a8a,#312e81,#0ea5e9);
            background-size:400% 400%;
            animation:bg 12s ease infinite;
        }

        @keyframes bg{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        .overlay{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
        }

        .card{
            width:750px;
            background:rgba(255,255,255,.12);
            backdrop-filter:blur(15px);
            border-radius:20px;
            color:white;
            border:1px solid rgba(255,255,255,.2);
            box-shadow:0 0 30px rgba(0,255,255,.3);
        }

        .form-control,
        .form-select{
            background:rgba(255,255,255,.15);
            color:white;
            border:none;
        }

        .form-control::placeholder{
            color:#ddd;
        }

        .form-select option{
            color:black;
        }

        .btn-ai{
            background:#00b4ff;
            color:white;
            font-weight:bold;
        }

        .btn-ai:hover{
            background:#0088cc;
            color:white;
        }

        h2{
            color:#00e5ff;
            font-weight:bold;
        }

        a{
            text-decoration:none;
        }

    </style>

</head>

<body>

<div class="overlay">

<div class="card p-4">

<div class="text-center">

<div class="text-center mb-4">

    <div class="logo">
        🤖 AI Employee Management
    </div>

    <h4 class="text-white">
        Next Generation Registration Portal
    </h4>

    <p class="text-light">
        Secure • Intelligent • Cloud Powered
    </p>

</div>
</div>

<form action="/add" method="POST">

<div class="row">

<div class="col-md-6 mb-3">

<label>Name</label>

<input
type="text"
name="name"
class="form-control"
placeholder="Employee Name"
required>

</div>

<div class="col-md-6 mb-3">

<label>Father Name</label>

<input
type="text"
name="father_name"
class="form-control"
placeholder="Father Name"
required>

</div>

<div class="col-md-6 mb-3">

<label>Mobile</label>

<input
type="text"
name="mobile"
class="form-control"
placeholder="9876543210"
required>

</div>

<div class="col-md-6 mb-3">

<label>Email</label>

<input
type="email"
name="email"
class="form-control"
placeholder="abc@gmail.com"
required>

</div>

<div class="col-md-6 mb-3">

<label>Qualification</label>

<select
name="qualification"
class="form-select">

<option>B.Tech</option>
<option>BCA</option>
<option>MCA</option>
<option>M.Tech</option>
<option>MBA</option>
<option>Diploma</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label>Address</label>

<input
type="text"
name="address"
class="form-control"
placeholder="Address"
required>

</div>

<div class="col-12 mt-3">

<button class="btn btn-ai w-100 btn-lg">

🚀 Register Employee

</button>

</div>

</form>

<div class="top-bar">
    <a href="/admin" class="admin-btn">
        🔐 Admin Login
    </a>
</div>

</div>

</div>

</body>
</html>
