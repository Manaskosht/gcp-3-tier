<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:linear-gradient(135deg,#0f172a,#1e3a8a,#312e81,#0ea5e9);
            background-size:400% 400%;
            animation:bg 12s ease infinite;
            color:white;
            font-family:Segoe UI,sans-serif;
        }

        @keyframes bg{
            0%{background-position:0% 50%;}
            50%{background-position:100% 50%;}
            100%{background-position:0% 50%;}
        }

        .glass{
            background:rgba(255,255,255,.10);
            backdrop-filter:blur(15px);
            border-radius:20px;
            padding:25px;
            margin-top:40px;
            box-shadow:0 0 20px rgba(0,255,255,.25);
        }

        table{
            color:white !important;
        }

        th{
            background:#00b4ff !important;
            color:white;
        }

        .form-control{
            background:rgba(255,255,255,.15);
            color:white;
            border:none;
        }

        .form-control::placeholder{
            color:#ddd;
        }

        .btn{
            margin-right:5px;
        }

    </style>

</head>

<body>

<div class="container">

<div class="glass">

<div class="d-flex justify-content-between align-items-center mb-4">

<div>

<h2>🤖 AI Workshop Admin Dashboard</h2>

<h5>Total Employees : {{ total }}</h5>

</div>

<div>

<a href="/logout" class="btn btn-danger">

Logout

</a>

</div>

</div>

<input
type="text"
id="search"
class="form-control mb-4"
placeholder="Search Employee..."
onkeyup="searchEmployee()">

<div class="table-responsive">

<table
class="table table-bordered table-hover text-center"
id="employeeTable">

<thead>

<tr>

<th>Name</th>

<th>Father Name</th>

<th>Mobile</th>

<th>Email</th>

<th>Qualification</th>

<th>Address</th>

<th>Action</th>

</tr>

</thead>

<tbody>

{% for emp in employees %}

<tr>

<td>{{ emp.name }}</td>

<td>{{ emp.father_name }}</td>

<td>{{ emp.mobile }}</td>

<td>{{ emp.email }}</td>

<td>{{ emp.qualification }}</td>

<td>{{ emp.address }}</td>

<td>

<a
href="/edit/{{ emp._id }}"
class="btn btn-warning btn-sm">

Edit

</a>

<a
href="/delete/{{ emp._id }}"
class="btn btn-danger btn-sm"
onclick="return confirm('Delete this employee?')">

Delete

</a>

</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</div>

<script>

function searchEmployee(){

let input=document.getElementById("search").value.toLowerCase();

let rows=document.querySelectorAll("#employeeTable tbody tr");

rows.forEach(function(row){

let text=row.innerText.toLowerCase();

row.style.display=text.includes(input) ? "" : "none";

});

}

</script>

</body>

</html>
