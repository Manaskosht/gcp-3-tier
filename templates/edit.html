<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Edit Employee</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{

background:#0f172a;

color:white;

font-family:Segoe UI;

}

.container{

max-width:700px;

margin-top:50px;

}

.card{

background:#1e293b;

padding:30px;

border-radius:15px;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h2 class="mb-4">

Edit Employee

</h2>

<form action="/update/{{ employee._id }}" method="POST">

<input class="form-control mb-3" name="name" value="{{ employee.name }}" required>

<input class="form-control mb-3" name="father_name" value="{{ employee.father_name }}" required>

<input class="form-control mb-3" name="mobile" value="{{ employee.mobile }}" required>

<input class="form-control mb-3" name="email" value="{{ employee.email }}" required>

<input class="form-control mb-3" name="qualification" value="{{ employee.qualification }}" required>

<input class="form-control mb-3" name="address" value="{{ employee.address }}" required>

<button class="btn btn-success w-100">

Update Employee

</button>

</form>

<br>

<a href="/dashboard" class="btn btn-secondary w-100">

Back

</a>

</div>

</div>

</body>

</html>
